name: Publish Coder Image

# Builds and pushes the per-team coding-agent image (oduist/oduflow-coder) to
# Docker Hub. Publication is tied to *merge*: it runs only when docker/agent/**
# lands on main — never from a feature branch. The version is read from the
# Dockerfile's CODER_VERSION arg, so bumping it there is what ships a new
# :<version> (both :<version> and :latest are pushed).
#
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access
# token with push rights to the oduist org).

on:
  push:
    branches: [main]
    paths:
      - "docker/agent/**"
      - ".github/workflows/publish-coder.yml"
  workflow_dispatch:

# Never run two publishes at once; a newer commit supersedes an in-flight one.
concurrency:
  group: publish-coder
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read coder version from Dockerfile
        id: ver
        run: |
          version="$(sed -n 's/^ARG CODER_VERSION=//p' docker/agent/Dockerfile | head -n1)"
          if [ -z "$version" ]; then
            echo "CODER_VERSION not found in docker/agent/Dockerfile" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Coder version: $version"

      - name: Set up QEMU
        # Cross-arch emulation so the amd64 runner can also build linux/arm64
        # (Apple Silicon dev machines otherwise fail to pull the image).
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/agent
          # Multi-arch manifest so both x86_64 servers and Apple Silicon can pull.
          platforms: linux/amd64,linux/arm64
          # Keep the pushed tag a clean 2-platform manifest (no attestation entries).
          provenance: false
          push: true
          build-args: |
            CODER_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            oduist/oduflow-coder:${{ steps.ver.outputs.version }}
            oduist/oduflow-coder:latest
