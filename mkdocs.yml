site_name: Oduflow
site_url: https://docs.oduflow.dev
site_description: AI-first Odoo development and CI tool with reusable database templates, powered by MCP
repo_url: https://github.com/oduist/oduflow
repo_name: oduist/oduflow

theme:
  name: gitbook

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

extra_css:
  - css/custom.css

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Installation & Configuration: installation.md
  - Use Cases & Workflows: use-cases.md
  - Template Management: templates.md
  - Environment Management: environments.md
  - Auxiliary Services: services.md
  - Extra Addons Repositories: extra-addons.md
  - Web Dashboard & REST API: web-api.md
  - MCP Tools Reference: mcp-tools.md
  - CLI Reference: cli.md
  - Traefik Routing: traefik.md
  - Multi-Instance Support: multi-instance.md
  - Authentication & Security: security.md
  - Running in Docker: docker.md
  - Internals: internals.md
  - Licensing: licensing.md
  - Changelog: changelog.md
