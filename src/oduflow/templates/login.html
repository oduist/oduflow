<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oduflow — Sign in</title>
  <link rel="preload" href="/static/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
  <link rel="icon" href="/static/icon.png" type="image/png" sizes="32x32">
  <style>
    @font-face {
      font-family: "Outfit";
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url("/static/outfit-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    :root {
      /* "The Engineer's Console" tokens — shared with the dashboard (see DESIGN.md) */
      --bg: oklch(0.07 0.01 260);
      --surface-raised: oklch(0.16 0.012 260);
      --border: oklch(0.3 0.013 260);
      --border-raised: oklch(0.34 0.015 260);
      --text: oklch(0.93 0.005 260);
      --text-dim: oklch(0.7 0.01 260);
      --accent: oklch(0.6 0.2 260);
      --red: oklch(0.65 0.22 25);
      --radius: 0.625rem;
      --radius-sm: 0.425rem;
      --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent) 50%, transparent);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    :is(button, input):focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }
    .card {
      width: 100%;
      max-width: 340px;
      background: var(--surface-raised);
      border: 1px solid var(--border-raised);
      border-radius: var(--radius);
      box-shadow: 0 24px 64px rgba(0,0,0,0.65);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card img.logo { height: 36px; align-self: center; }
    .card h1 {
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
    }
    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
    }
    input[type="password"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      font-family: inherit;
      font-size: 14px;
    }
    input[type="password"]:focus {
      border-color: var(--accent);
    }
    button {
      margin-top: 6px;
      background: var(--accent);
      color: oklch(0.98 0 0);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    .error {
      background: color-mix(in oklab, var(--red) 12%, transparent);
      border: 1px solid color-mix(in oklab, var(--red) 30%, transparent);
      color: var(--red);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <img class="logo" src="/logo.png" alt="Oduflow logo">
    <h1>Sign in</h1>
    <!--ERROR-->
    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
