[project]
name = "oduflow"
version = "0.1.0"
description = "MCP server for automating Odoo development environments"
authors = [
    { name = "Flow Contributor" }
]
dependencies = [
    "fastmcp==2.14.3",
    "docker",
    "python-dotenv",
    "packaging",
    "cryptography",
]
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oduflow = "oduflow.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oduflow"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
norecursedirs = ["src"]
addopts = "-m 'not heavyweight'"
markers = [
    "integration: integration tests against live Docker (may be slow)",
    "heavyweight: slow tests (init/destroy/create/delete env) — run with pytest -m heavyweight",
]

