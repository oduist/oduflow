[project]
name = "oduflow"
version = "1.68.0"
description = "AI-first Odoo development and CI tool with reusable database templates, powered by MCP"
authors = [
    { name = "Oduist" }
]
readme = "README.md"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
keywords = ["odoo", "mcp", "docker", "development", "ci"]
dependencies = [
    "fastmcp==2.14.3",
    "docker",

    "packaging",
    "cryptography",
    "itsdangerous",
    "tomli>=2.0; python_version < '3.11'",
    # Production backup subsystem: S3 client + per-chunk compression.
    "boto3",
    "zstandard",
]

[project.optional-dependencies]
# Type checker pinned so a local `mypy src/oduflow` matches the CI gate exactly
# (see .github/workflows/tests.yml). Install with: pip install -e ".[dev]"
dev = ["mypy==2.3.0"]

[project.urls]
Homepage = "https://oduflow.dev"
Documentation = "https://oduflow.dev"
Repository = "https://github.com/oduist/oduflow"
Issues = "https://github.com/oduist/oduflow/issues"
Changelog = "https://github.com/oduist/oduflow/releases"

[project.scripts]
oduflow = "oduflow.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oduflow"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# The repo root has a non-Python `docker/` directory (docker/agent/ — Dockerfile
# and shell scripts). With PEP 420 namespace packages enabled (mypy's default),
# `import docker` resolves to that local dir instead of the docker SDK, producing
# ~100 phantom "Module has no attribute" errors. All oduflow packages are regular
# (they ship __init__.py), so turning namespace packages off is safe and makes
# `import docker` resolve to site-packages.
namespace_packages = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
norecursedirs = ["src"]
addopts = "-m 'not heavyweight'"
markers = [
    "integration: integration tests against live Docker (may be slow)",
    "heavyweight: slow tests (init/destroy/create/delete env) — run with pytest -m heavyweight",
]
