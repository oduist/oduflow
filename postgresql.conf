# PostgreSQL Configuration
# Server: 2 vCPU, 4 GB RAM, HDD
# Optimized for Odoo workload

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================
listen_addresses = '*'
port = 5432
max_connections = 100

# =============================================================================
# MEMORY
# =============================================================================
# 25% of RAM for shared buffers (standard recommendation)
shared_buffers = 1GB

# Per-query working memory (4GB / max_connections * 2)
work_mem = 16MB

# Maintenance operations (VACUUM, CREATE INDEX, etc.)
maintenance_work_mem = 256MB

# OS cache estimate — total RAM minus shared_buffers
effective_cache_size = 3GB

# =============================================================================
# WAL (Write-Ahead Log)
# =============================================================================
wal_level = replica
wal_buffers = 16MB
min_wal_size = 512MB
max_wal_size = 2GB

# Spread checkpoint writes over 70% of checkpoint interval (reduce I/O spikes on HDD)
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# =============================================================================
# QUERY PLANNER
# =============================================================================
# HDD: random I/O is ~4x more expensive than sequential
random_page_cost = 4.0
seq_page_cost = 1.0
effective_io_concurrency = 2

# =============================================================================
# PARALLEL QUERIES
# =============================================================================
max_worker_processes = 2
max_parallel_workers_per_gather = 1
max_parallel_workers = 2
max_parallel_maintenance_workers = 1

# =============================================================================
# LOGGING
# =============================================================================
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# =============================================================================
# AUTOVACUUM
# =============================================================================
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_delay = 20ms

# =============================================================================
# LOCALE & ENCODING
# =============================================================================
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# =============================================================================
# MISC
# =============================================================================
# Reduce fsync overhead on HDD
synchronous_commit = on
full_page_writes = on
huge_pages = try
