##
# Integration test scenarios for Flow.
#
# Each scenario defines:
#   tool            – MCP tool name (from server.py), OR
#   cli             – CLI command name ("init" or "destroy")
#   args            – keyword arguments
#   expect_contains – list of substrings that MUST appear in the result
#   needs_env       – if true, a live Docker environment is set up automatically
#
# Usage:
#   CLI:    flow call <tool_name> [args...]
#   pytest: pytest tests/test_integration.py -m integration
##

scenarios:

  # ── System (CLI commands, not MCP tools) ──────────────────────────
  init_default:
    cli: init
    marks: [heavyweight]
    args: {}
    expect_contains:
      - "System"

  destroy:
    cli: destroy
    marks: [heavyweight]
    args: {}
    expect_contains:
      - "System"

  # ── Environments ──────────────────────────────────────────────────
  create_env_main:
    tool: create_environment
    marks: [heavyweight]
    args:
      branch: "18.0"
      repo_url: "https://github.com/oduist/oduflow_test.git"
      odoo_image: "odoo:18.0"
    expect_contains:
      - "Environment provisioned"
      - "Database"

  create_env_feature:
    tool: create_environment
    marks: [heavyweight]
    args:
      branch: "feature-login-fix"
      repo_url: "https://github.com/oduist/oduflow_test.git"
      odoo_image: "odoo:18.0"
    expect_contains:
      - "Environment provisioned"

  delete_env:
    tool: delete_environment
    marks: [heavyweight]
    args:
      env_name: "18.0"
    expect_contains:
      - "torn down"

  list_envs:
    tool: list_environments
    args: {}
    expect_contains: []

  info_main:
    tool: get_environment_info
    needs_env: true
    args:
      env_name: "18.0"
    expect_contains:
      - "Environment Info"

  restart_main:
    tool: restart_environment
    needs_env: true
    args:
      env_name: "18.0"
    expect_contains:
      - "restarted"

  stop_main:
    tool: stop_environment
    needs_env: true
    args:
      env_name: "18.0"
    expect_contains:
      - "stopped"

  start_main:
    tool: start_environment
    needs_env: true
    args:
      env_name: "18.0"
    expect_contains:
      - "started"

  # ── Odoo operations ──────────────────────────────────────────────
  logs_main:
    tool: get_environment_logs
    needs_env: true
    args:
      env_name: "18.0"
      n_lines: 50
    expect_contains: []

  test_modules:
    tool: run_odoo_tests
    needs_env: true
    args:
      env_name: "18.0"
      modules: "sale"
    expect_contains:
      - "Test Results"

  install_modules:
    tool: install_odoo_modules
    marks: [heavyweight]
    needs_env: true
    args:
      env_name: "18.0"
      modules: "sale,crm"
    expect_contains:
      - "Modules installed"

  upgrade_modules:
    tool: upgrade_odoo_modules
    marks: [heavyweight]
    needs_env: true
    args:
      env_name: "18.0"
      modules: "sale"
    expect_contains:
      - "Modules upgraded"
